name: Deploy BizTrack to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: biztrack-deploy
  cancel-in-progress: false

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'ecosystem.config.js'
              - 'scripts/ensure-uv.sh'
              - 'scripts/deploy-backend-uv.sh'
            frontend:
              - 'frontend/**'
            migrations:
              - 'backend/alembic/versions/**'
              - '!backend/alembic/versions/.gitkeep'

  sync-code:
    runs-on: ubuntu-latest
    needs: check-changes
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deployment secret
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "::error::SSH_PRIVATE_KEY repository secret is not configured. Add it (the private key) before deploying."
            exit 1
          fi

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          HOST="${SERVER_HOST:-81.17.101.93}"
          ssh-keyscan -H "${HOST}" >> ~/.ssh/known_hosts || true

      - name: Sync code to server (rsync)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e
          HOST="${SERVER_HOST:-81.17.101.93}"
          USER="${SERVER_USER:-root}"
          TARGET="${DEPLOY_PATH:-/opt/biztrack}"
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.vscode/' \
            --exclude='desktop' \
            --exclude='mobile' \
            --exclude='logs/' \
            --exclude='backups/' \
            --exclude='tokens/' \
            --exclude='uploads/' \
            --exclude='*.log' \
            --exclude='.env*' \
            --exclude='service-account.json' \
            --exclude='client_secrets.json' \
            --exclude='venv/' \
            --exclude='.venv/' \
            --exclude='.uv-cache/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ "${USER}@${HOST}:${TARGET}/"

  deploy-backend:
    runs-on: ubuntu-latest
    needs: [check-changes, sync-code]
    if: needs.check-changes.outputs.backend == 'true'
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup Python backend with uv
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          HOST="${SERVER_HOST:-81.17.101.93}"
          USER="${SERVER_USER:-root}"
          TARGET="${DEPLOY_PATH:-/opt/biztrack}"
          ssh -o StrictHostKeyChecking=no "${USER}@${HOST}" "TARGET='${TARGET}' bash" << 'ENDSSH'
            set -euo pipefail
            export PATH="${HOME}/.local/bin:${PATH}"
            if ! command -v uv >/dev/null 2>&1; then
              echo "Installing uv..."
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="${HOME}/.local/bin:${PATH}"
            fi
            cd "${TARGET}/backend"
            uv sync --frozen --no-dev
            echo "Backend dependencies synced"
          ENDSSH

  run-migrations:
    runs-on: ubuntu-latest
    needs: [check-changes, sync-code, deploy-backend]
    if: needs.check-changes.outputs.migrations == 'true'
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run Alembic migrations
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          HOST="${SERVER_HOST:-81.17.101.93}"
          USER="${SERVER_USER:-root}"
          TARGET="${DEPLOY_PATH:-/opt/biztrack}"
          ssh -o StrictHostKeyChecking=no "${USER}@${HOST}" "TARGET='${TARGET}' bash" << 'ENDSSH'
            set -euo pipefail
            export PATH="${HOME}/.local/bin:${PATH}"
            bash "${TARGET}/scripts/run-migrations.sh" "${TARGET}/backend"
            echo "Migrations completed"
          ENDSSH

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [check-changes, sync-code]
    if: needs.check-changes.outputs.frontend == 'true'
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install dependencies and build frontend
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          HOST="${SERVER_HOST:-81.17.101.93}"
          USER="${SERVER_USER:-root}"
          TARGET="${DEPLOY_PATH:-/opt/biztrack}"
          ssh -o StrictHostKeyChecking=no "${USER}@${HOST}" "TARGET='${TARGET}' bash" << 'ENDSSH'
            set -euo pipefail
            cd "${TARGET}/frontend"
            npm ci
            npm run build
            node scripts/prepare-standalone.js
            if [ ! -d .next/standalone/.next/static ]; then
              echo "Missing .next/standalone/.next/static after prepare-standalone"
              exit 1
            fi
            if [ ! -d .next/standalone/public ]; then
              echo "Missing .next/standalone/public after prepare-standalone"
              exit 1
            fi
            echo "Frontend build complete"
          ENDSSH

  restart-services:
    runs-on: ubuntu-latest
    needs: [check-changes, sync-code, deploy-backend, run-migrations, deploy-frontend]
    if: ${{ !cancelled() && needs.deploy-backend.result != 'failure' && needs.deploy-frontend.result != 'failure' && needs.run-migrations.result != 'failure' && (needs.check-changes.outputs.backend == 'true' || needs.check-changes.outputs.frontend == 'true') }}
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Restart PM2 services
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          HOST="${SERVER_HOST:-81.17.101.93}"
          USER="${SERVER_USER:-root}"
          TARGET="${DEPLOY_PATH:-/opt/biztrack}"
          ssh -o StrictHostKeyChecking=no "${USER}@${HOST}" "TARGET='${TARGET}' bash" << 'ENDSSH'
            set -euo pipefail
            cd "${TARGET}"
            mkdir -p "frontend/.next/standalone/logs" "backend/logs"
            pm2 delete biztrack-backend biztrack-frontend 2>/dev/null || true
            pm2 start ecosystem.config.js --update-env
            pm2 save
            for app in biztrack-backend biztrack-frontend; do
              pid="$(pm2 pid "${app}" 2>/dev/null || true)"
              if [ -z "${pid}" ] || [ "${pid}" = "0" ]; then
                echo "PM2 app ${app} failed to start"
                exit 1
              fi
            done
            echo "Services restarted"
          ENDSSH

  health-check:
    runs-on: ubuntu-latest
    needs: [check-changes, restart-services]
    if: ${{ !cancelled() && needs.restart-services.result == 'success' }}
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Health check backend and frontend
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          HOST="${SERVER_HOST:-81.17.101.93}"
          USER="${SERVER_USER:-root}"
          ssh -o StrictHostKeyChecking=no "${USER}@${HOST}" bash << 'ENDSSH'
            set -euo pipefail
            check_url() {
              local url="$1" name="$2"
              for attempt in 1 2 3 4 5; do
                if curl -sf -o /dev/null "$url"; then
                  echo "${name} check passed: ${url}"
                  return 0
                fi
                echo "${name} check attempt ${attempt}/5 failed, retrying..."
                sleep 6
              done
              echo "${name} check failed: ${url}"
              return 1
            }
            sleep 8
            check_url http://localhost:8000/health/simple "Backend"
            check_url http://localhost:3000/ "Frontend"
            echo "All checks passed"
          ENDSSH